{% load static %}
<!-- Confirmation Modal -->
<div id="confirmModal{{ modal_id }}" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h5>
                <i class="bi bi-question-circle text-primary me-2"></i>
                {{ title|default:"Confirmer l'action" }}
            </h5>
            <button class="btn" onclick="closeModal('confirmModal{{ modal_id }}')">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="modal-body">
            <p>{{ message|default:"Êtes-vous sûr de vouloir effectuer cette action ?" }}</p>
            {% if details %}
            <p class="text-muted small">
                <i class="bi bi-info-circle me-1"></i>
                {{ details }}
            </p>
            {% endif %}
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('confirmModal{{ modal_id }}')">
                <i class="bi bi-arrow-left me-2"></i>Annuler
            </button>
            <button type="button" class="btn btn-primary" onclick="confirmAction('confirmModal{{ modal_id }}')">
                <i class="bi bi-check-circle me-2"></i>Confirmer
            </button>
        </div>
    </div>
</div>

<script>
function confirmAction(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
        const form = modal.querySelector('form');
        if (form) {
            form.submit();
        } else {
            // Si pas de formulaire, on ferme et on exécute le callback
            closeModal(modalId);
            const callback = window[modalId + '_callback'];
            if (typeof callback === 'function') {
                callback();
            }
        }
    }
}
</script>
