{% load static %}
<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-left">
        <button class="navbar-toggle-desktop" id="sidebarToggle" title="Afficher/masquer le menu">
            <i class="bi bi-list"></i>
        </button>
        <button class="navbar-toggle" id="mobileMenuToggle">
            <i class="bi bi-list"></i>
        </button>
        <h5 class="mb-0">{% block page_title %}Tableau de bord{% endblock %}</h5>
    </div>
    
    <div class="navbar-right">
        <div class="navbar-search">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" placeholder="Rechercher...">
        </div>
        
        <div class="navbar-actions">
            <a href="{% url 'notifications' %}" class="navbar-action" title="Notifications">
                <i class="bi bi-bell"></i>
            </a>
            
            <a href="{% url 'messages' %}" class="navbar-action" title="Messages">
                <i class="bi bi-chat-dots"></i>
            </a>
            
            <div class="navbar-user" id="userDropdown">
                {% if user.utilisateur.agent.photo %}
                    <img src="{{ user.utilisateur.agent.photo.url }}" alt="{{ user.username }}">
                {% else %}
                    <div class="navbar-user-avatar">
                        <i class="bi bi-person-fill"></i>
                    </div>
                {% endif %}
                <div class="navbar-user-info">
                    <div class="navbar-user-name">{{ user.username }}</div>
                    <div class="navbar-user-role">{{ user.utilisateur.get_role_display }}</div>
                </div>
                <div class="dropdown-menu" id="userDropdownMenu">
                    <a href="{% url 'profile' %}" class="dropdown-item">
                        <i class="bi bi-person-badge me-2"></i>Mon Profil
                    </a>
                    <a href="{% url 'messages' %}" class="dropdown-item">
                        <i class="bi bi-envelope me-2"></i>Messages
                    </a>
                    <a href="{% url 'notifications' %}" class="dropdown-item">
                        <i class="bi bi-bell-fill me-2"></i>Notifications
                    </a>
                    <a href="{% url 'parametres' %}" class="dropdown-item">
                        <i class="bi bi-sliders me-2"></i>Paramètres
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="{% url 'logout' %}" class="dropdown-item text-danger">
                        <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
