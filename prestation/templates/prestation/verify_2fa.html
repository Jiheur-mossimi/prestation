{% extends 'base.html' %}
{% load static %}

{% block title %}Vérification 2FA{% endblock %}

{% block page_title %}Vérification Google Authenticator{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3 text-center">
                        <i class="bi bi-shield-check" style="font-size: 3rem; color: #3b82f6;"></i>
                        <h5 class="mt-2">Entrez le code à 6 chiffres</h5>
                    </div>
                    <div class="mb-3">
                        <input type="text" name="code_2fa" class="form-control form-control-lg text-center" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle me-2"></i>Vérifier
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
