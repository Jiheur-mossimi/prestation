{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Mobile</title>
    <link href="{% static 'vendors/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendors/bootstrap-icons/font/bootstrap-icons.css' %}" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; padding: 15px; }
        .card-custom { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 420px; width: 100%; overflow: hidden; border: none; }
        .card-header-custom { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 25px 30px; text-align: center; }
        .card-header-custom i { font-size: 2rem; margin-bottom: 8px; }
        .card-header-custom h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0; }
        .card-body-custom { padding: 30px; }
        .form-label { font-weight: 600; color: #334155; font-size: 0.9rem; margin-bottom: 8px; display: block; }
        .form-control { padding: 13px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; transition: all 0.2s ease; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); outline: none; }
        .btn-primary-custom { background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; padding: 14px; font-weight: 600; border-radius: 10px; width: 100%; color: white; font-size: 1rem; transition: all 0.3s ease; }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.4); }
        .btn-back { color: #64748b; text-decoration: none; font-size: 0.9rem; display: block; text-align: center; margin-top: 15px; }
        .btn-back:hover { color: #3b82f6; }
        #result { display: none; margin-top: 20px; border-radius: 10px; font-size: 0.9rem; padding: 15px; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
        .code-display { font-size: 2rem; font-weight: 800; letter-spacing: 8px; text-align: center; background: #eff6ff; border: 2px dashed #3b82f6; border-radius: 10px; padding: 15px; margin-top: 15px; color: #2563eb; display: none; }
    </style>
</head>
<body>
    <div class="card card-custom">
        <div class="card-header-custom">
            <i class="bi bi-phone"></i>
            <h2>Connexion Mobile</h2>
            <p style="opacity: 0.8; font-size: 0.85rem; margin: 5px 0 0;">Entrez votre username pour obtenir votre code</p>
        </div>
        <div class="card-body-custom">
            <form id="form-mobile">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username ou Matricule</label>
                    <input type="text" name="username" class="form-control" placeholder="Entrez votre username" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary-custom">
                    <i class="bi bi-shield-lock me-2"></i>Générer mon code
                </button>
                <a href="{% url 'qr_code_login' %}" class="btn-back">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
            </form>
            <div id="result" class=""></div>
            <div id="code-display" class="code-display"></div>
        </div>
    </div>
    <script>
        document.getElementById('form-mobile').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const response = await fetch('{% url "mobile_login" %}', {
                method: 'POST',
                body: formData,
                headers: {'X-Requested-With': 'XMLHttpRequest'}
            });
            const data = await response.json();
            const result = document.getElementById('result');
            const codeDisplay = document.getElementById('code-display');
            result.style.display = 'block';
            result.className = data.success ? 'success' : 'error';
            result.innerHTML = '<i class="bi ' + (data.success ? 'bi-check-circle' : 'bi-exclamation-circle') + ' me-2"></i>' + data.message;
            if (data.success) {
                document.getElementById('form-mobile').reset();
                // Afficher le code en grand
                codeDisplay.textContent = data.code;
                codeDisplay.style.display = 'block';
                setTimeout(() => { codeDisplay.style.display = 'none'; result.style.display = 'none'; }, 300000); // 5 minutes
            }
        });
    </script>
</body>
</html>
