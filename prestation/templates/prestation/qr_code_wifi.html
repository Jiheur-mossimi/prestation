{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code WiFi</title>
    <link href="{% static 'vendors/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendors/bootstrap-icons/font/bootstrap-icons.css' %}" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #1e40af 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container-custom { max-width: 500px; width: 100%; }
        .card-qr { background: white; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .card-qr h3 { font-weight: 700; color: #1e3a8a; margin-bottom: 20px; }
        .qr-img { max-width: 280px; margin: 0 auto 20px; }
        .info-section { background: #f0fdf4; border: 2px solid #d1fae5; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .info-section h5 { color: #065f46; font-weight: 700; margin-bottom: 10px; }
        .info-section p { color: #64748b; margin-bottom: 5px; }
        .info-section strong { color: #065f46; }
    </style>
</head>
<body>
    <div class="container-custom">
        <div class="card-qr">
            <h3><i class="bi bi-wifi me-2"></i>Connexion WiFi</h3>
            <p class="text-muted">Scannez ce QR code avec votre téléphone pour vous connecter au réseau</p>
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code WiFi" class="qr-img img-fluid">
            
            <div class="info-section">
                <h5><i class="bi bi-router me-2"></i>Informations du réseau</h5>
                <p><strong>Réseau :</strong> {{ wifi_info.ssid }}</p>
                <p><strong>Mot de passe :</strong> {{ wifi_info.password }}</p>
                <p class="mb-0"><strong>Sécurité :</strong> {{ wifi_info.security }}</p>
            </div>
        </div>
    </div>
</body>
</html>
